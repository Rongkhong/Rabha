<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Rabha Vocabulary Search</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Apply Inter font globally */
        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden; /* Prevent horizontal scroll */
        }
        /* Style for highlighting matched text */
        .highlight {
            background-color: #fff08a; /* Lighter yellow */
            font-weight: 600; /* Semibold */
            padding: 0 2px;
            border-radius: 3px;
        }
        /* Scrollbar styling */
        #results::-webkit-scrollbar, #bookmarks-list::-webkit-scrollbar {
            width: 6px;
        }
        #results::-webkit-scrollbar-track, #bookmarks-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        #results::-webkit-scrollbar-thumb, #bookmarks-list::-webkit-scrollbar-thumb {
            background: #a8a8a8; /* Lighter gray */
            border-radius: 10px;
        }
        #results::-webkit-scrollbar-thumb:hover, #bookmarks-list::-webkit-scrollbar-thumb:hover {
            background: #777; /* Darker gray on hover */
        }
        /* Ensure icons are vertically centered */
        .search-icon {
             position: absolute;
             right: 0.75rem; /* right-3 */
             top: 50%;
             transform: translateY(-50%);
             height: 1.25rem; /* h-5 */
             width: 1.25rem; /* w-5 */
             color: #9ca3af; /* text-gray-400 */
        }
        /* Sidebar Styles */
        #bookmarks-sidebar {
            position: fixed;
            top: 0;
            right: -350px; /* Start off-screen */
            width: 320px;
            height: 100%;
            background-color: white;
            box-shadow: -4px 0 12px rgba(0,0,0,0.1);
            transition: right 0.3s ease-in-out;
            z-index: 50;
            display: flex;
            flex-direction: column;
        }
        #bookmarks-sidebar.open {
            right: 0;
        }
        /* Overlay for when sidebar is open */
        #sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 40;
            display: none; /* Hidden by default */
        }
        #bookmarks-sidebar.open + #sidebar-overlay {
            display: block;
        }
        /* Bookmark button styling */
        .bookmark-btn {
            cursor: pointer;
            color: #9ca3af; /* gray-400 */
            transition: color 0.2s;
        }
        .bookmark-btn:hover {
            color: #6b7280; /* gray-500 */
        }
        .bookmark-btn.bookmarked {
            color: #4f46e5; /* indigo-600 */
        }
        .bookmark-btn.bookmarked:hover {
            color: #3730a3; /* indigo-800 */
        }

    </style>
</head>

            { word: "ba-gi", class: "ref.", meaning: "See nukhah." },
            { word: "ba-gi-na", class: "n.", meaning: "(~ bhagina) nephew, brother's son (for a sister) or sister's son (for a brother)." },
            { word: "ba-gi-ni", class: "n.", meaning: "(~ bhagini) niece, brother's daughter (for a sister) or sister's daughter (for a brother)." },
            { word: "ba-grai", class: "v.i.", meaning: "fall." },
            { word: "ba-ha", class: "n.", meaning: "lower shoulder." },
            { word: "-ba-i¹", class: "suff.", meaning: "1. indicating 'location or place where': cika nah-bai, where there is water. 2. suff. indicating 'situation or time when': baikho-bai, during the baikho festival; hatina réh-bai, when or while going to the market." },
            { word: "-ba-i²", class: "suff.", meaning: "to certain verbs indicating that the action was or happened to be performed after arriving at the place of conversation: bóh-bai, come and meet, happened to arrive to witness; kani-bai, come and say; nuk-bai, come and see; tah-bai, come and put." },
            { word: "bai¹", class: "v.i.", meaning: "(~ bhai) be yellow." },
            { word: "bai²", class: "ref.", meaning: "See hal." },
            { word: "bai³", class: "n.", meaning: "1. (pl. ~bijah). god, deity, spirit. bai ahka, n. palm-lines. baidam, n. a place (generally wooded) dedicated to a deity and where sacrifices are regularly held, a sacrificial place. bai sai, n. (echo) deities. baisuh, n. evil spirit, spirit of some deity. 2. (verbal) bai dáha, coming of a deity into a sacrifice in answer to the act of propitiation. bai dúha, be affected by the power of the deity during sacrifice. bai gojoka, fulfil or redeem the promise made earlier to perform a sacrifice. bai g¡dáha, call on a deity through a sacrifice. bai hahkraia, call out to deity by using vocative style using divine attributes. bai kaka, be attacked (lit. bitten) by a deity inflicting sickness. bai naa, be possessed by (evil) spirit, become mad, be out of senses. bai pusia, keep a household deity and fulfil the requirements of propitiating the deity. bai saka, propitiate a deity by making a promise to offer a sacrifice some time later. bai thata, make a sacrifice to a deity. bai urgia, worship a deity, bow and thus show veneration for a deity." },
            { word: "bai-du-muk", class: "n.", meaning: "(arch.) arrow." },
            { word: "bai-ek", class: "n.", meaning: "a variety of bamboo." },
            { word: "bai-kheh", class: "n.", meaning: "scorpion. baikheh jícap, n. stinging organ of scorpion." },
            { word: "bai-kho", class: "n.", meaning: "name of a goddess." },
            { word: "bai-kho-leh", class: "n.", meaning: "1. whirlwind. 2. n. spot on crown of head where hair is whirled around. 3. (verbal). baikholeh rapa, form a whirlwind." },
            { word: "bai-lo-la", class: "n.", meaning: "1. matted hair. 2. (verbal) bailola khaa, become matted, entangle in thick mass (hair)." },
            { word: "bai-lu-ri", class: "n.", meaning: "a gale, storm." },
            { word: "bai-sah-koi", class: "n.", meaning: "bow. baisehkia, n. rainbow." },
            { word: "bai-seh-ki-a", class: "ref.", meaning: "See baisahkoi." },
            { word: "bai-sram", class: "v.i.", meaning: "light yellow. baisasram, v.i. be light yellow." },
            { word: "bai-sthop", class: "ref.", meaning: "See baitrop." },
            { word: "bai-trop", class: "v.i.", meaning: "(~ baisthop) be light yellow. baitotrop, v.i. be light yellow." },
            { word: "ba-ji", class: "n.", meaning: "as in: (verbal) baji koa (tera koa tera baji koa), lightning and thunder strike with discharge of imaginary bolt or shaft (believed by locals to be wedge-shaped hard stones sometimes discovered from fields) during crash of thunder." },
            { word: "ba-jih", class: "adv.", meaning: "1. outside. 2. (idiom) bajina múha, (euphem.) have a desire to pass urine. bajina réha, (euphem.) go out to pass urine." },
            { word: "bak¹", class: "n.", meaning: "pig, swine, bak kaka, n. pork. bak nogor, n. piggery, a shelter for pigs. bak phaceh, n. pig's longer tooth. bak thop, n. shelter of wild pigs." },
            { word: "bak²", class: "v.t.", meaning: "wrench things apart with instruments that have been wedged in: bákhan keke baka, pull apart parts of firewood that have been split partially, split firewood apart with axe that has been driven in." },
            { word: "bak-ca-la", class: "n.", meaning: "thatch of roof that is kept projecting outward from the wall or pillar on the breadthwise side of a house." },
            { word: "bá-keh", class: "n.", meaning: "axe." },
            // Added B words below
            { word: "bá-khan", class: "n.", meaning: "1. firewood. 2. (verbal) bákhan keka, split firewood. bákhan khr¡ha, spread firewood for drying. bákhan roka (bákhan r¡ta), carry firewood from where it had been left for drying, bákhan ruguta, collect firewood." },
            { word: "ba-kha-nai", class: "v.t.", meaning: "praise, glorify." },
            { word: "ba-kha-ni", class: "n.", meaning: "a woman who praises herself or speaks boastfully about herself." },
            { word: "bá-khep", class: "n.", meaning: "forceps (of bamboo)." },
            { word: "bá-khop", class: "n.", meaning: "bamboo or wood placed lengthwise across rafters in framework of roof." },
            { word: "bá-khu¹", class: "n.", meaning: "spade-like instrument with broad edge with a straight handle and used as a crowbar." },
            { word: "bá-khu²", class: "ref.", meaning: "See pancak." },
            { word: "bak-jap", class: "v.i.", meaning: "be middle-sized (tree). bakjap bakjap, adv. of middle-sized: bakjap bakjap cithoa, is beautiful with the beauty of a medium-sized (tree). bakjajap, a.& adv. beautiful as a middle-sized tree." },
            { word: "bá-kok", class: "n.", meaning: "bamboo tube, section of a bamboo (used for carrying water or for keeping things in): bákok khúmah khúcepa, cut smooth the cross-section of a bamboo tube." },
            { word: "ba-kra", class: "n.", meaning: "open expanse of land without many large trees." },
            { word: "ba-kri", class: "ref.", meaning: "See cakri." },
            { word: "bak-tuk", class: "n.", meaning: "1. a variety of wild yam or arum stalk of which is used as vegetable. baktuk akkai, n. black variety of. 2. (idiom) baktuk táthen dogota (baktuk nagra koa), root of sprouts at a distance into a new plant." },
            { word: "ba-lah ba-lah", class: "a.", meaning: "(~ bhalah bhalah) (arch. sacrificial formula). healthy, prosperous: balah balah cáhkhan, may (subj.) become healthy and prosperous." },
            { word: "bam¹", class: "n.", meaning: "home-made bread made from rice-flour. bamcepa, flat home-made bread that is folded and usu. filled with a mixture of sesame and sugar or coconut and sugar." },
            { word: "bam²", class: "v.i.", meaning: "bend ones head, submit oneself, surrender: bame ráa, accept in obedience or submissively." },
            { word: "ba-ma-ri", class: "n.", meaning: "(pl. ~tah, bijah) a married person, a father. bamari jímari, n. (echo) married men and women." },
            { word: "bam-bur", class: "ref.", meaning: "See banbur." },
            { word: "bam-ci", class: "n.", meaning: "rice-flour: bamci khr¡ta, sprinkle a mixture of and water (as part of a sacrificial or purification ceremony)." },
            { word: "bam-ci-kha-li", class: "n.", meaning: "curry made of rice-flour with or without vegetable." },
            { word: "ban¹", class: "n.", meaning: "winnowing fan." },
            { word: "ban²", class: "n.", meaning: "1. a magical spell. 2. (verbal) ban koa, cast a spell. ban thiphrita, break a spell." },
            { word: "bán³", class: "v.i.", meaning: "use or go through (road) frequently: bánan bánan rambe mine réhjo kamibe cáneca, having made several trips the path has become a beaten track but the work was not accomplished." },
            { word: "-ba-na-bani", class: "suff.", meaning: "meaning 'since, because, on account of': rah phabana rambijah tikap tikap cáhjo, because it rained the roads have become slushy and sticky." },
            { word: "ba-na", class: "n.", meaning: "flood, bana cika, n. flood water." },
            { word: "bah", class: "n.", meaning: "(~ bahbah) paternal uncle (father's younger brother). bahbra, n. same as bah (definitive)." }, // Corrected ban -> bah
            { word: "báh", class: "v.t.", meaning: "block. báha kóma, v.t. (echo) lit. fence to protect, fig. protect and look after." }, // Corrected bán -> báh
            { word: "bah-al", class: "n.", meaning: "(~ turu) (echo) Bengalies." }, // Corrected ban-al -> bah-al

            { word: "bah-bah", class: "ref.", meaning: "See bah." }, // Corrected ban-ban -> bah-bah
            { word: "bah-bur", class: "a.", meaning: "(~ bambur) undersized, short, fat and stocky." }, // Corrected ban-bur -> bah-bur
            { word: "bah-khoh", class: "n.", meaning: "cricket: bahkhoh horjeha, cricket chirps." }, // Corrected ban-khon -> bah-khon
            { word: "bah-khrah", class: "ref.", meaning: "See cihkhrah." }, // Corrected ban-khran -> bah-khrah
            { word: "bah-ku-a", class: "n.", meaning: "a bamboo rod used for carrying weight attached to both the ends. bahkua táthen, n. bandy legs, bow-shaped legs." }, // Corrected ban-ku-a -> bah-ku-a
            { word: "bap-dai", class: "n.", meaning: "as in: (verbal) bap-dai khaa, enter into a covenanted relationship as parent and child." },
            { word: "-ba-pe-ke", class: "suff.", meaning: "meaning 'during, while': khár-bapeke, while doing, réh- bapeke, while going." },
            { word: "ba-phra", class: "int.", meaning: "poor fellow!" },
            { word: "bar¹", class: "n.", meaning: "day (in relation to the names of days): tébe ato bar?, what day (is) today?" },
            { word: "bar²", class: "n.", meaning: "(~ bhar) 1. load. 2. (verbal) bar paia. carry a load, bar tipaia, lay or lift some load on to someone." },
            { word: "bar³", class: "v.i.", meaning: "return: bare réha, go back." },
            { word: "bar-⁴", class: "suff.", meaning: "with Assamese numerals especially from upwards of four replacing native classifiers like cao-, phén- and jakri- for repetitive events: pas bar, five times." },
            { word: "bár", class: "n.", meaning: "1. fire, bárdam, n. fire-place, place where fire is lit (for cooking, warming oneself, and in ancient days for keeping embers live for lighting fire when required). 2. (verbal) bár caka, kindle fire, light fire, make fire. bár dapa, warm oneself by the fire. bár khama, burn, catch fire. bár paka, fire burns brightly, bár mota, fire dies out or goes out, extinguishes. bár seta, produce fire by rubbing together dry bamboo pieces. bár sóa, burn, set something on fire, put fire to something. bár tomota, put out a fire, extinguish a fire. bár toproma (bár tomoka), bury embers in ash so that they do not die out completely to be used for lighting a fire later on. bár tipaka, make fire burn well. 3. (idiom) bár rákhua, cremate." },
            { word: "ba-ra ba-ra", class: "adv.", meaning: "just opposite, facing each other." },
            { word: "ba-rai¹", class: "v.t.", meaning: "give, offer, place or keep as an offering, make ready what is required: mai baraia, serve rice and keep everything else ready for meal." },
            { word: "ba-rai²", class: "n.", meaning: "1. clan, barai huri (barai hur), n. (echo) clans and their inter-relatedness. 2. (verbal) barai dáha, join a clan through a ceremony. barai g¡dáha, legally receive someone into a clan. barai khéa, have no impediments arising from the relationship of clans for matrimonial alliance. barai tata, belong to related clans." },
            { word: "bá-ram", class: "a.", meaning: "1. last stage in the growth of a cluster of bamboo after which it flowers bears seeds and dies. 2. (verbal) báram phéha, reach the ~ stage." },
            { word: "bar-bar-i", class: "adv.", meaning: "immediately, without delay." },
            { word: "bár-ce-keh", class: "n.", meaning: "ember." },
            { word: "bar-cuh", class: "n.", meaning: "a sub-clan." },
            { word: "ba-ré", class: "n.", meaning: "1. a temporary dam usually made in paddy fields or across small streams with clay and bamboo to trap fish. 2. (verbal) baré khaa, build such a dam." },
            { word: "ba-re ba-re", class: "adv.", meaning: "again and again, often, repeatedly." },
            { word: "ba-ri¹", class: "n.", meaning: "(~ barti) plot of land on which house is built. bari bagan, n. (echo) garden or plot of cultivated land." },
            { word: "ba-ri²", class: "v.i.", meaning: "increase, become more." },
            { word: "bár-ji-bra", class: "n.", meaning: "1. (arch). embers that are kept live under ash to be used for lighting fire when required. 2. (uncommon) matches." },
            { word: "bár-ji-kham", class: "n.", meaning: "a piece of firewood that is burning or is partially burnt." },
            { word: "bár-joh-da", class: "ref.", meaning: "See bárjohtha." }, // Corrected bárjon-da -> bárjoh-da
            { word: "bár-joh-tha", class: "n.", meaning: "(~ bárjohda) 1. flambeau, a fire-torch usually made with long pieces of dry bamboo or thatch grass. 2. (verbal) bárjohtha khaa, prepare a ~. bárjohtha sóa, light such a torch." }, // Corrected bárjon-tha -> bárjoh-tha
            { word: "bár-ju", class: "n.", meaning: "log meant for splitting firewood." },
            { word: "bar-ka¹", class: "a.", meaning: "1. (arch.) hired, on hire. 2. (verbal) barka b¡ta, take on hire. barka ráa (barkana rábaa), take on hire." },
            { word: "bár-ka²", class: "ref.", meaning: "See cika." },
            { word: "bár-kha-dam", class: "n.", meaning: "funeral pyre." },
            { word: "bár-khu", class: "v.i.", meaning: "emit smoke, be smoky." },
            { word: "bár-khuh-ci", class: "n.", meaning: "1. smoke: bárkhuhci truh-truh dogta, emit smoke in large quantity, it is smoking greatly. 2. n. a rope-like torch made by twisting and tying hay to keep a smouldering fire, used either for the sake of the fire or as fumigation against insects: bárkhuhci ph¡saka, make such a torch from hay." }, // Corrected bárkhun-ci -> bárkhuh-ci
            { word: "bar-mah", class: "ref.", meaning: "See seomah." }, // Corrected bar-man -> bar-mah
            { word: "bar-mas-i", class: "adv.", meaning: "always: barmasi ganda, as always or as usual." },
            { word: "ba-ró", class: "ref.", meaning: "See cukuh." },
            { word: "ba-roh", class: "n.", meaning: "1. seat or place for people during a common meal 2. (verbal) baroh daha, arrange or prepare ~ (usu. by placing long pieces of wood or bamboo). baroh khaa, tie backrest (to lean against while sitting). 3. (idiom) baroh b¡ta, segregate and assign separate place for individuals (who for some reason cannot be given place along with others)." }, // Corrected ba-ron -> ba-roh
            { word: "ba-roh-gi-ri", class: "n.", meaning: "president (of meeting, association etc.)." }, // Corrected ba-ron-gi-ri -> ba-roh-gi-ri

            { word: "bar-ti²", class: "n. & cl.", meaning: "1. n. rod for carrying load by two people with the load tied in the middle. 2. cl. for number of trips made carrying some load with: barti-sa, one trip or one rod-load." },
            { word: "bár-tih-drap", class: "n.", meaning: "tiny spark." }, // Corrected bár-tin-drap -> bár-tih-drap
            { word: "ba-sai", class: "v.t.", meaning: "select, choose." },
            { word: "ba-sa-kal-ah", class: "adv.", meaning: "eternal, everlasting. basakalaha, adv. for all times, for eternity." }, // Corrected ba-sa-kal-an -> ba-sa-kal-ah

            { word: "bá-sek", class: "n.", meaning: "cloth for carrying children on the back, cloth tied from shoulder across chest for dances: básek khepe sábra báa (básek khae sábra báa), carry a child on the back in a cloth." },
            { word: "ba-si", class: "v.t.", meaning: "wash (clothes): nen basia, wash clothes." },
            { word: "ba-si-a", class: "a.", meaning: "left over from yesterday (food, work etc.): cika basia, water drawn yesterday; kami basia, work that could not be completed yesterday; mai basia, rice left over from yesterday." },
            { word: "ba-si-thip", class: "ref.", meaning: "See basthip." },

            { word: "ba-thah", class: "n.", meaning: "1. enclosed area for herding together cattle. 2. (verbal) bathah rákhua, herd cattle together in~." }, // Corrected ba-than -> ba-thah
            { word: "ba-that", class: "v.t.", meaning: "(~ bathá) plant, erect, set up (post, pillar, stone): nophak bathata, erect a pillar for the house; phóhka bathata, erect a stone for the stove or fire-place." },

            { word: "bau-bau", class: "a.", meaning: "have or be in plenty, in excess, abundant: cika baubaubana hal baina janca, as there is too much water it is difficult to plough; ube khúmah kámah baubau, he has thick and bushy beard." },
            { word: "-be", class: "suff.", meaning: "1. indicating definitive marker: nok-be khame réhjo, the house was burnt down. 2. meaning 'what about?': nen-be?, what about the cloth? 3. indicating a mild emphasis as if stating the obvious or the natural esp. in a reply to a question: ame saksahjana-be, I will manage alone (as a reply to 'why do you work all alone? ); paisa tohca-be, there is no money (as a reply to 'why don't you go to school?')." },
            { word: "be-bok", class: "n.", meaning: "a big tree having unbranched stem for a considerable height found commonly by riverside (Tetrameles nudeflora)." },

            { word: "be-do", class: "interrog.", meaning: "when, at what time. bedoba, adv. at some time. bedoba bedoba, adv. at some time, occasionally. bedobatah, adv. some time in the future. bedoba bedobatah, adv. at some time in the future." },

            { word: "cé-sa", class: "a.", meaning: "a piece, a strip, a small section (usu. of flat things and when torn or cut): rái césa, a section of banana leaf." },
            { word: "cet", class: "v.t.", meaning: "(~ cé) tear (cloth, paper, leaves etc.)." },

            // Added Sample D words below
             { word: "da-bi", class: "n.", meaning: "1. a demand. 2. (verbal) dabi khára, demand, make a demand. 3. v.t. demand." },
            { word: "da-bo-ne", class: "n.", meaning: "a big needle or sharpened peg used as needle to stitch mouth of sacks etc. and also used to string together big fish while fishing: dabone suka, string fish together with a ~." },
            { word: "da-ci", class: "adv.", meaning: "jokingly, not seriously, for fun, as jest: daci ¡na, say as fun. daci daci, adv. jokingly." },
            { word: "da-da", class: "n.", meaning: "1. (pl. ~roh) elder brother. dadabra, n. same as dada (definitive). dadabrah, n. elder brother and younger sibling: dadabrah kamih, an elder brother and a younger sibling; dadabrah sarijon, an elder brother and three younger siblings. 2. (verbal) dada mána, be related as an elder brother." },
            { word: "da-da-gat", class: "v.t.", meaning: "(~ dadagá) cause to fall, cause to come off (leaves, things attached)." },
            { word: "da-dui", class: "v.i.", meaning: "walk (child language)." },
            { word: "da-ga-i", class: "postpos.", meaning: "(~ digi) meaning 'in, at, on': i-dagai; here, in this place." },
            { word: "da-gai", class: "v.t.", meaning: "brand (done generally with hot iron or by the cross-section of three bamboo tied together and dipped in indelible ink)." },
            { word: "da-gat", class: "v.i.", meaning: "(~ dagá) fall, come off, detach (leaves, things so attached)." },
            { word: "dai¹", class: "n.", meaning: "1. offence. 2. (verbal) dai khára, commit an offence." },
            { word: "dai²", class: "n.", meaning: "compensation, fine, penalty: dai boraia, pay a fine or compensation." },
            { word: "dai³", class: "v.t.", meaning: "extend boundary: hádam daia, encroach on land." },
            { word: "dái", class: "v.i.", meaning: "have a landslide: há dáie réhjo, earth slid down, had a landslide." },
            { word: "dai-di¹", class: "n.", meaning: "a gong (musical instrument): daidi koka (daidi táma), beat a gong." },
            { word: "dai-di²", class: "n.", meaning: "1. relatives from the father's side: daidini há, ancestral property handed down from father to son. 2. n. a sub-clan: daidi barai, the ~ sub-clan." },
            { word: "dak", class: "v.t.", meaning: "pluck (fruits, flowers, leaves etc.), separate out, bargain." },
            { word: "da-ket", class: "n.", meaning: "1. robber. 2. (verbal) daket khára, rob." },
            { word: "da-kha", class: "", meaning: "as in: (verbal) dakha khaa, v.i. coagulate, solidify." },
            { word: "da-kha da-kha", class: "a. & adv.", meaning: "as coagulated matter: kalamkai kai tuksidoh sí dakha dakha dogota, when the sick man coughs blood come out as coagulated." },
            { word: "da-khap-", class: "cl.", meaning: "for patches of clouds: rahkohp dakhap-sa, a patch of cloud." },
            { word: "da-khe-la", class: "n.", meaning: "a piece of bamboo or wood that is employed to throw at something (to pluck fruits, at birds and animals to drive them away etc.): dakhela koa, throw ~." },
            { word: "da-khi", class: "v.t.", meaning: "hide from, block vision." },
            { word: "da-khla-", class: "ref.", meaning: "See dakhap-." },
            { word: "da-khla da-khla", class: "ref.", meaning: "See dakhap dakhap." },
            { word: "da-khor", class: "n.", meaning: "a kind of tree with yellow bunches of flowers whose bark used be chewed as a mild stimulant. dakhorphah, n. the ~ tree." },
            { word: "da-kra", class: "adv.", meaning: "suddenly, unexpectedly, within a short time: kalamkai dakra páne réhjo, sickness suddenly took a turn far worse. dakra dikra, adv. (echo) suddenly, on the spur of the moment: dakra dikra sia, die suddenly without preparation." },
            { word: "dal¹", class: "n.", meaning: "traditional Rabha shield (of rhinoceros hide and studded with four stars and a half-moon). dal toral, n. (echo) sword and shield." },
            { word: "dal-²", class: "cl.", meaning: "for counting long and slender things including trees especially with Assamese numerals upwards of four and occasionally also with native numerals: pan dal-sa, one tree; khorok dal-nih, two strands of hair; bá cari dal, four bamboo." },
            { word: "da-la", class: "n.", meaning: "1. round bamboo winnowing fan for cleaning rice: dala peke mai caoa, winnow paddy with ~. 2. a type of ear-ring (usu. of gold)." },
            { word: "da-lai", class: "n.", meaning: "1. branch: dalai dogota (dalai dima), put forth branches. 2. (verbal) dalai r¡ta, prune branches." },
            { word: "da-lan", class: "v.i.", meaning: "flat and big: cak dalana, leaf is big; nakor dalana, ear is big. dalalah, a. & adv. very flat and big: cak dalalah cuha, leaf is very big." },
            { word: "da-le", class: "ref.", meaning: "See dole." },
            { word: "dam¹", class: "n.", meaning: "1. cost, price. 2. (verbal) dam cata, is expensive, is dear, is costly. dam daka, bargain." },
            { word: "dam²", class: "n.", meaning: "1. mat. damkúr, n. strips used for weaving mats. 2. (idiom) dam kaka, (dam kake réha), be bed-ridden, be laid up (lit. be bitten by the mat)." },
            { word: "-dam³", class: "suff.", meaning: "indicates location of activity; bár-dam, fire-place, place where fire is lit; bai-dam, sacrificial place, a place dedicated to a deity where sacrifices are held regularly." },
            { word: "dam⁴", class: "cl.", meaning: "for things heaped up: há dam-sa, one heap of mud; pan dam- anih, two heaps of wood." },
            { word: "da-mai", class: "v.t.", meaning: "gather together into a heap: mai curcur damaie tana, gather paddy into a heap." },
            { word: "da-mar-sa", class: "adv.", meaning: "a short while, for a short while: damarsa kami ráa, for a short period." },
            { word: "dam-blak", class: "ref.", meaning: "See nukblak." }

            // ... More 'b' words would continue here
        ];

        // --- DOM Elements ---
        const searchRabhaInput = document.getElementById('search-rabha-input');
        const searchEnglishInput = document.getElementById('search-english-input');
        const resultsDiv = document.getElementById('results');
        const resultsContainer = document.getElementById('results-container');
        const bookmarksList = document.getElementById('bookmarks-list');
        const bookmarksSidebar = document.getElementById('bookmarks-sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');

        // --- Bookmark State & LocalStorage ---
        let bookmarkedWords = JSON.parse(localStorage.getItem('rabhaBookmarks')) || [];

        // --- Utility function to escape special characters for RegExp ---
        function escapeRegExp(string) {
          // Escape special characters for use in a regular expression
          return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); // $& means the whole matched string
        }

        // --- Highlight function ---
        function highlightMatches(text, query) {
            if (!text || !query) return text || ''; // Return original text if no query or text
            const escapedQuery = escapeRegExp(query);
            // Create a case-insensitive global regular expression
            const regex = new RegExp(escapedQuery, 'gi');
            // Replace all occurrences with the highlighted version
            return text.replace(regex, '<span class="highlight">$&</span>');
        }


        // --- Display Bookmarks ---
        function displayBookmarks() {
            bookmarksList.innerHTML = ''; // Clear current list
            if (bookmarkedWords.length === 0) {
                bookmarksList.innerHTML = '<p class="text-gray-400 text-center text-sm">No bookmarks yet.</p>';
                return;
            }

            bookmarkedWords.forEach(word => {
                const entry = vocabulary.find(item => item.word === word);
                if (entry) {
                    const li = document.createElement('div');
                    li.className = 'p-2 bg-gray-100 rounded flex justify-between items-start text-sm';
                    li.innerHTML = `
                        <div>
                            <p class="font-medium text-indigo-700">${entry.word}</p>
                            <p class="text-xs text-gray-600 mt-1">${entry.meaning.substring(0, 50)}...</p>
                        </div>
                        <button onclick="removeBookmark('${entry.word}')" class="ml-2 text-red-500 hover:text-red-700 focus:outline-none p-1">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    `;
                    bookmarksList.appendChild(li);
                }
            });
             // Update bookmark icons in search results if visible
            updateVisibleBookmarkIcons();
        }

        // --- Toggle Bookmark ---
        function toggleBookmark(word) {
            const index = bookmarkedWords.indexOf(word);
            if (index > -1) {
                // Remove bookmark
                bookmarkedWords.splice(index, 1);
            } else {
                // Add bookmark
                bookmarkedWords.push(word);
            }
            // Save to localStorage
            localStorage.setItem('rabhaBookmarks', JSON.stringify(bookmarkedWords));
            // Update sidebar display
            displayBookmarks();
            // Update the specific button clicked
            updateBookmarkIcon(word);

        }

         // --- Remove Bookmark (from sidebar) ---
        function removeBookmark(word) {
            bookmarkedWords = bookmarkedWords.filter(item => item !== word);
            localStorage.setItem('rabhaBookmarks', JSON.stringify(bookmarkedWords));
            displayBookmarks(); // Re-render sidebar
            updateBookmarkIcon(word); // Update icon in search results if visible
        }

        // --- Update a specific bookmark icon ---
        function updateBookmarkIcon(word) {
             const button = document.querySelector(`.bookmark-btn[data-word="${word}"]`);
             if (button) {
                 const isBookmarked = bookmarkedWords.includes(word);
                 button.classList.toggle('bookmarked', isBookmarked);
                 // Update SVG icon based on bookmarked state
                 button.innerHTML = isBookmarked ?
                    `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M5 4a2 2 0 012-2h6a2 2 0 012 2v14l-5-2.5L5 18V4z" /></svg>` : // Filled icon
                    `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" /></svg>`; // Outline icon
             }
        }

        // --- Update all visible bookmark icons ---
        function updateVisibleBookmarkIcons() {
            const buttons = document.querySelectorAll('.bookmark-btn');
            buttons.forEach(button => {
                const word = button.getAttribute('data-word');
                updateBookmarkIcon(word);
            });
        }


        // --- Search Function ---
        function handleSearch() {
            const rabhaQuery = searchRabhaInput.value.toLowerCase().trim();
            const englishQuery = searchEnglishInput.value.toLowerCase().trim();
            resultsDiv.innerHTML = '';

            if (!rabhaQuery && !englishQuery) {
                 resultsDiv.innerHTML = '<p class="text-gray-500 text-center">Start typing in either search bar...</p>';
                return;
            }

            const filteredResults = vocabulary.filter(entry => {
                const wordMatch = !rabhaQuery || (entry.word && entry.word.toLowerCase().startsWith(rabhaQuery));
                const meaningMatch = !englishQuery || (entry.meaning && entry.meaning.toLowerCase().includes(englishQuery));
                return wordMatch && meaningMatch;
            });

            if (filteredResults.length > 0) {
                filteredResults.forEach(entry => {
                    const entryDiv = document.createElement('div');
                    entryDiv.className = 'p-3 bg-white border border-gray-200 rounded-lg shadow-sm flex justify-between items-start';

                    const highlightedWord = rabhaQuery ? entry.word.replace(
                        new RegExp(`^${escapeRegExp(rabhaQuery)}`, 'i'),
                        '<span class="highlight">$&</span>'
                    ) : entry.word;

                    const highlightedMeaning = englishQuery ? highlightMatches(entry.meaning, englishQuery) : entry.meaning;

                    const isBookmarked = bookmarkedWords.includes(entry.word);
                    const bookmarkIcon = isBookmarked ?
                       `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M5 4a2 2 0 012-2h6a2 2 0 012 2v14l-5-2.5L5 18V4z" /></svg>` :
                       `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" /></svg>`;

                    entryDiv.innerHTML = `
                        <div class="flex-grow pr-4">
                            <p class="font-semibold text-indigo-700">${highlightedWord || 'N/A'}</p>
                            <p class="text-sm text-gray-600 mt-1"><span class="font-medium text-gray-800">Class:</span> ${entry.class || 'N/A'}</p>
                            <p class="text-sm text-gray-600 mt-1"><span class="font-medium text-gray-800">Meaning:</span> ${highlightedMeaning || 'N/A'}</p>
                        </div>
                        <button class="bookmark-btn flex-shrink-0 p-1 ${isBookmarked ? 'bookmarked' : ''}" data-word="${entry.word}" onclick="toggleBookmark('${entry.word}')">
                           ${bookmarkIcon}
                        </button>
                    `;
                    resultsDiv.appendChild(entryDiv);
                });
            } else {
                 let message = 'No results found';
                 if (rabhaQuery && englishQuery) {
                     message += ` matching both "${searchRabhaInput.value}" and "${searchEnglishInput.value}".`;
                 } else if (rabhaQuery) {
                     message += ` for "${searchRabhaInput.value}".`;
                 } else if (englishQuery) {
                    message += ` for "${searchEnglishInput.value}".`;
                 }
                resultsDiv.innerHTML = `<p class="text-gray-500 text-center">${message}</p>`;
            }
        }

         // --- Sidebar Toggle Function ---
        function toggleSidebar() {
            bookmarksSidebar.classList.toggle('open');
            sidebarOverlay.style.display = bookmarksSidebar.classList.contains('open') ? 'block' : 'none';
        }


        // --- Initial Setup ---
        resultsDiv.innerHTML = '<p class="text-gray-500 text-center">Start typing in either search bar...</p>';
        displayBookmarks();

    </script>

</body>
</html>
